@if (customLogo) {
    <img src="{{customLogo}}" [class]="getClasses()" [attr.style]="'height:'+height" />
} @else {
    <svg [class]="getClasses()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" [attr.style]="'height:'+height">
        <text class="text" x="0" y="150" style="font-family: 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 180px; fill: var(--bs-body-color);">Wathiqa</text>
    </svg>
}
